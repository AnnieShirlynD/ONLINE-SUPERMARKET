
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Supermarket</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  color: #222;
}
header {
  background: #16834a;
  color: white;
  text-align: center;
  padding: 22px;
}
.container {
  max-width: 850px;
  margin: 20px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #ccc;
}
h2 { color: #16834a; }
label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}
input, select, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #bbb;
  border-radius: 5px;
}
button {
  margin-top: 15px;
  padding: 11px 16px;
  background: #16834a;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  padding: 9px;
  border: 1px solid #ccc;
  text-align: left;
}
th { background: #e1f3e7; }
.notice { color: #16834a; font-weight: bold; }
footer {
  text-align: center;
  padding: 15px;
  background: #dcefe2;
}
</style>
</head>
<body>

<header>
  <h1>Online Supermarket</h1>
  <p>Customer Orders and Item Classification</p>
</header>

<div class="container">

<section class="card">
<h2>Customer Order Form</h2>
<form id="orderForm">
  <label>Customer Name</label>
  <input id="customer" required>

  <label>Address</label>
  <textarea id="address" required></textarea>

  <label>Phone Number</label>
  <input id="phone" type="tel" required>

  <label>Email</label>
  <input id="email" type="email" required>

  <label>Item Name</label>
  <select id="item" required>
    <option value="">Select item</option>
    <option>Rice</option>
    <option>Milk</option>
    <option>Bread</option>
    <option>Apple</option>
    <option>Soap</option>
    <option>Cooking Oil</option>
  </select>

  <label>Quantity</label>
  <input id="quantity" type="number" min="1" required>

  <label>Price per Item (₹)</label>
  <input id="price" type="number" min="0.01" step="0.01" required>

  <button type="submit">Place Order</button>
</form>
<p id="orderMessage" class="notice"></p>
</section>

<section class="card">
<h2>Item Classification Form</h2>
<form id="itemForm">
  <label>Item ID</label>
  <input id="itemId" required>

  <label>Item Name</label>
  <input id="itemName" required>

  <label>Category</label>
  <select id="category" required>
    <option value="">Select category</option>
    <option>Groceries</option>
    <option>Dairy Products</option>
    <option>Fruits and Vegetables</option>
    <option>Bakery</option>
    <option>Household Products</option>
  </select>

  <label>Unit Price (₹)</label>
  <input id="itemPrice" type="number" min="0.01"
         step="0.01" required>

  <button type="submit">Add Item</button>
</form>

<table>
<thead>
<tr><th>ID</th><th>Item</th><th>Category</th><th>Price (₹)</th></tr>
</thead>
<tbody id="itemTable"></tbody>
</table>
</section>

<section class="card">
<h2>Customer Orders</h2>
<table>
<thead>
<tr><th>Customer</th><th>Item</th><th>Quantity</th><th>Total (₹)</th></tr>
</thead>
<tbody id="orderTable"></tbody>
</table>
</section>

</div>

<footer>Online Supermarket Management System | SaaS Demo</footer>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const customer = document.getElementById("customer").value;
  const item = document.getElementById("item").value;
  const quantity = Number(document.getElementById("quantity").value);
  const price = Number(document.getElementById("price").value);
  const total = quantity * price;

  const row = document.createElement("tr");
  [customer, item, quantity, total.toFixed(2)].forEach(value => {
    const cell = document.createElement("td");
    cell.textContent = value;
    row.appendChild(cell);
  });
  document.getElementById("orderTable").appendChild(row);

  document.getElementById("orderMessage").textContent =
    "Order placed successfully! Total: ₹" + total.toFixed(2);
  this.reset();
});

document.getElementById("itemForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const values = [
    document.getElementById("itemId").value,
    document.getElementById("itemName").value,
    document.getElementById("category").value,
    Number(document.getElementById("itemPrice").value).toFixed(2)
  ];

  const existing = [...document.querySelectorAll("#itemTable tr")]
    .some(row => row.cells[0].textContent === values[0]);

  if (existing) {
    alert("This Item ID already exists.");
    return;
  }

  const row = document.createElement("tr");
  values.forEach(value => {
    const cell = document.createElement("td");
    cell.textContent = value;
    row.appendChild(cell);
  });
  document.getElementById("itemTable").appendChild(row);
  this.reset();
});
</script>
</body>
</html>
